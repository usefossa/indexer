[package]
name = "fossa-indexer"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bincode = "1"
bs58 = "0.5"
dotenvy = "0.15"
ed25519-dalek = "2.2"
futures-util = "0.3"
hex = "0.4"
jsonschema = { version = "0.59", default-features = false }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
solana-pubkey = { version = "3", features = ["curve25519"] }
solana-transaction = { version = "=3.0.0", default-features = false, features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "fs"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
yellowstone-grpc-proto = { version = "12.4", default-features = false, features = ["tonic"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

name: security maintenance
on:
  workflow_run:
    workflows: ['fast ci', 'pr review', 'Copilot', 'Running Copilot Code Review']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: write
concurrency:
  group: security-maintenance
  cancel-in-progress: false
jobs:
  merge:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.actor.login == 'dependabot[bot]' || github.event.workflow_run.name == 'pr review' || github.event.workflow_run.actor.id == 175728472)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const maintain = require('./.github/dependency-updates.cjs');
            await maintain({ github, context, core, workflow: '' });
